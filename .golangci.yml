version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: unused-parameter
          disabled: true
    gosec:
      excludes:
        - G304 # file paths come from the volume being archived, validated in extract
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, unparam, errcheck]
      - path: internal/simcluster/|cmd/keeper-demo/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SlateGitOrg/keeper
