# Hourly CSI snapshots of named claims, kept for two days plus daily for a week.
# Snapshot data stays in the storage system; the manifest goes to the bucket.
apiVersion: backup.keeper.dev/v1alpha1
kind: BackupPolicy
metadata:
  name: redis-snapshots
  namespace: shop
spec:
  schedule: "@hourly"
  retention:
    keepHourly: 48
    keepDaily: 7
  template:
    spec:
      source:
        pvcNames: [redis-data-redis-0]
      driver:
        type: CSISnapshot
        csi:
          volumeSnapshotClassName: csi-hostpath-snapclass
          readyTimeoutSeconds: 900
      storage:
        endpoint: https://minio.backup.svc.cluster.local:9000
        bucket: cluster-backups
        prefix: prod
        credentialsSecretRef:
          name: backup-s3
      hooks:
        pre:
          - name: bgsave
            podSelector:
              matchLabels: {app: redis}
            command: ["redis-cli", "SAVE"]
            onError: Continue
