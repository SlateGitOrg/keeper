apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: keeper
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keeper
    spec:
      serviceAccountName: controller-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: keeper:dev
          command: ["/keeper"]
          args:
            - manager
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: KEEPER_MOVER_IMAGE
              value: keeper:dev
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
